# Artemis OKR evaluation tasks (custom Roboflow models).
# Astra Autolabel disabled for now — re-add kind: autolabel entries if needed.
# Select which to run via:  --tasks plant_stand,flowers,pods   or  --tasks all
# Select models via:        --model custom  (default)

workspace: cgiar-workspace

defaults:
  match_iou: 0.50
  # Production-like floor; use --custom-conf to override per run
  custom_conf: 0.01
  random_seed: 42
  download_format: coco
  force_redownload: false
  split: test  # evaluation uses the test split

tasks:
  plant_stand:
    gt_project: artemis_2_bushbean_bb_benchmark-hxtfg
    gt_version: 3
    classes:
      - bushbean
    models:
      - key: custom
        label: Custom plant-stand RF-DETR
        provider: Roboflow Serverless
        kind: roboflow
        model_id: cgiar-workspace/bushbean_stand-row_count_diversity-2-rfdetr-medium-t4

  flowers:
    gt_project: artemis_2_bushbean_bb_benchmark2
    gt_version: 3
    classes:
      - Flower-closed
      - Flower-dry
      - Flower-fallen
      - Flower-open
      - Plant-Bean
    models:
      - key: custom
        label: Custom flower v8
        provider: Roboflow Serverless
        kind: roboflow
        model_id: dup_merged_1_to_15_flower_inst_seg-mhpnh/8

  pods:
    # Source of truth for pod GT (v2 = 713-image eval set)
    gt_project: artemis_2_bushbean_pod_benchmark
    gt_version: 2
    classes:
      - Fruit_pod
    models:
      - key: custom
        label: Custom pod v53
        provider: Roboflow Serverless
        kind: roboflow
        model_id: artemis2_pod_segmentation_batch3-gd8ng/53
