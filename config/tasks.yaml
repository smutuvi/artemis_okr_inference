# Artemis OKR evaluation tasks (Astra / Sol Autolabel vs custom Roboflow models).
# Select which to run via:  --tasks flowers,pods   or  --tasks all
# Select models via:        --model sol  |  --models astra,custom  |  --models all

workspace: cgiar-workspace

defaults:
  match_iou: 0.50
  custom_conf: 0.40
  random_seed: 42
  download_format: coco
  force_redownload: false

tasks:
  plant_stand:
    gt_project: artemis_2_bushbean_bb_benchmark-hxtfg
    gt_version: 3
    classes:
      - bushbean
    models:
      - key: astra
        label: GPT-6 Astra
        provider: Roboflow Autolabel
        kind: autolabel
        model_type: gpt-6-astra-boxes
      - key: sol
        label: GPT-6 Sol
        provider: Roboflow Autolabel
        kind: autolabel
        model_type: gpt-6-sol-boxes
      - key: custom
        label: Custom plant-stand RF-DETR
        provider: Roboflow Serverless
        kind: roboflow
        model_id: cgiar-workspace/bushbean_stand-row_count_diversity-2-rfdetr-medium-t4

  flowers:
    gt_project: artemis_2_bushbean_bb_benchmark2
    gt_version: 3
    classes:
      - Flower-closed
      - Flower-dry
      - Flower-fallen
      - Flower-open
      - Plant-Bean
    models:
      - key: astra
        label: GPT-6 Astra
        provider: Roboflow Autolabel
        kind: autolabel
        model_type: gpt-6-astra-boxes
      - key: sol
        label: GPT-6 Sol
        provider: Roboflow Autolabel
        kind: autolabel
        model_type: gpt-6-sol-boxes
      - key: custom
        label: Custom flower v44
        provider: Roboflow Serverless
        kind: roboflow
        model_id: dup_merged_1_to_15_flower_inst_seg-mhpnh/44

  pods:
    gt_project: artemis_2_bushbean_pod_benchmark
    gt_version: 1
    # Evaluate pods only; Plant_Bean often dominates mAP noise vs Fruit_pod
    classes:
      - Fruit_pod
    models:
      - key: astra
        label: GPT-6 Astra
        provider: Roboflow Autolabel
        kind: autolabel
        model_type: gpt-6-astra-boxes
      - key: sol
        label: GPT-6 Sol
        provider: Roboflow Autolabel
        kind: autolabel
        model_type: gpt-6-sol-boxes
      - key: custom
        label: Custom pod v53
        provider: Roboflow Serverless
        kind: roboflow
        model_id: artemis2_pod_segmentation_batch3-gd8ng/53
