[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okr-inference"
version = "0.1.0"
description = "Artemis OKR eval: GPT-6 Astra Autolabel vs custom Roboflow models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "roboflow>=1.1",
  "requests>=2.32,<3",
  "Pillow>=10,<12",
  "pycocotools>=2.0",
  "matplotlib>=3.7",
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "numpy>=1.24",
]

[project.scripts]
okr-inference = "okr_inference.cli:main"

[tool.setuptools.packages.find]
include = ["okr_inference*"]
